name: Documentation

on:
  push:
    branches:
      - gh-pages
    paths:
      - "**/*.html"
      - assets/**
      - docs/**
      - download/**
      - news/**
      - sponsors/**
      - .nojekyll
      - robots.txt
      - sitemap.xml
      - .github/scripts/validate-site.mjs
      - .github/workflows/docs.yml
  pull_request:
    branches:
      - gh-pages
    paths:
      - "**/*.html"
      - assets/**
      - docs/**
      - download/**
      - news/**
      - sponsors/**
      - .nojekyll
      - robots.txt
      - sitemap.xml
      - .github/scripts/validate-site.mjs
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate static website
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'gh-pages' || github.sha }}

      - name: Validate site structure and references
        run: node .github/scripts/validate-site.mjs

      - name: Check JavaScript syntax
        run: find assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
