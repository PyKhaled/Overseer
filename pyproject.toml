[dependency-groups]
runtime = [
    "Flask==3.1.3",
    "docker==7.1.0",
    "gunicorn==23.0.0",
]
dev = [
    { include-group = "runtime" },
    "coverage[toml]==7.15.4",
    "pip-audit==2.10.1",
    "ruff==0.16.4",
]

[tool.coverage.run]
branch = true
source = ["overseer"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
