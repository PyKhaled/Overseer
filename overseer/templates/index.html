<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overseer Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: #e5e7eb;
    }

    header {
      padding: 18px 20px;
      background: #111827;
      border-bottom: 1px solid #1f2937;
      display: flex;
      justify-content: space-between;
    }

    .container {
      padding: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 16px;
    }

    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 12px;
      padding: 16px;
    }

    .status {
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      margin-left: 8px;
      color: white;
      text-transform: capitalize;
    }

    .green { background: #16a34a; }
    .red { background: #dc2626; }
    .yellow { background: #ca8a04; }
    .gray { background: #374151; }

    .meta {
      font-size: 12px;
      color: #9ca3af;
      margin-top: 8px;
      line-height: 1.5;
    }

    .ports a {
      display: inline-block;
      margin: 4px 6px 0 0;
      padding: 4px 8px;
      border-radius: 6px;
      background: #1f2937;
      color: #60a5fa;
      text-decoration: none;
      font-size: 12px;
      cursor: pointer;
    }

    .ports a:hover {
      background: #374151;
    }

    .protocol {
      font-size: 10px;
      margin-left: 4px;
      color: #9ca3af;
    }

    button {
      margin-top: 10px;
      margin-right: 5px;
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      color: white;
    }

    .start { background: #16a34a; }
    .stop { background: #dc2626; }
    .restart { background: #2563eb; }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .message {
      display: none;
      margin: 16px 20px 0;
      padding: 10px 12px;
      border: 1px solid #7f1d1d;
      border-radius: 6px;
      background: #450a0a;
      color: #fecaca;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <div>🧠 Overseer Dashboard</div>
</header>

<div class="message" id="message" role="alert"></div>
<div class="container" id="grid"></div>


<footer style="text-align:center; padding:14px; font-size:11px; color:#6b7280; border-top:1px solid #1f2937; margin-top:20px;">
  © 2026 PyKhaled. All rights reserved.
  <br/>
  Built for internal infrastructure management •

  <a href="mailto:ahmedaka@icloud.com" style="color:#60a5fa; text-decoration:none;">Contact</a>
</footer>





<script>
  function statusClass(s) {
    s = (s || "").toLowerCase();
    if (s === "running") return "green";
    if (s === "exited") return "red";
    if (s === "restarting") return "yellow";
    return "gray";
  }

  function showError(message) {
    const element = document.getElementById("message");
    element.textContent = message;
    element.style.display = "block";
  }

  function clearError() {
    const element = document.getElementById("message");
    element.textContent = "";
    element.style.display = "none";
  }

  async function requestJson(url, options = {}) {
    const response = await fetch(url, options);
    let payload = null;
    try {
      payload = await response.json();
    } catch (error) {
      if (response.ok) {
        throw new Error("The server returned an invalid response");
      }
    }

    if (!response.ok) {
      throw new Error(payload?.error || `Request failed (${response.status})`);
    }

    return payload;
  }

  function buildUrl(protocol, host, port) {
    if (!host || !port) return null;
    const resolvedHost = (host === "0.0.0.0" || host === "::")
      ? window.location.hostname
      : host;
    const urlHost = resolvedHost.includes(":") ? `[${resolvedHost}]` : resolvedHost;
    return `${protocol}://${urlHost}:${port}`;
  }

  function addTextRow(parent, label, value) {
    const row = document.createElement("div");
    row.textContent = `${label}: ${value ?? "Unavailable"}`;
    parent.appendChild(row);
  }

  function renderPorts(parent, ports) {
    const seen = new Set();
    let rendered = false;

    Object.entries(ports || {}).forEach(([containerPort, mappings]) => {
      if (!Array.isArray(mappings)) return;

      mappings.forEach(mapping => {
        const host = mapping?.host_ip;
        const port = mapping?.host_port;
        const exposedPort = containerPort.split("/")[0];
        const protocol = exposedPort === "443" || exposedPort === "8443"
          ? "https"
          : "http";
        const url = buildUrl(protocol, host, port);
        if (!url || seen.has(url)) return;

        seen.add(url);
        rendered = true;

        const link = document.createElement("a");
        link.href = url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.append(document.createTextNode(containerPort));

        const protocolLabel = document.createElement("span");
        protocolLabel.className = "protocol";
        protocolLabel.textContent = `(${protocol.toUpperCase()})`;
        link.appendChild(protocolLabel);
        parent.appendChild(link);
      });
    });

    if (!rendered) {
      const empty = document.createElement("span");
      empty.style.color = "#6b7280";
      empty.textContent = "No ports published";
      parent.appendChild(empty);
    }
  }

  async function action(type, id, button) {
    button.disabled = true;
    try {
      await requestJson(`/api/service/${encodeURIComponent(id)}/${type}`, {
        method: "POST",
        headers: { "X-Overseer-CSRF": "1" }
      });
      clearError();
      await load();
    } catch (error) {
      showError(error.message);
    } finally {
      button.disabled = false;
    }
  }

  function createActionButton(type, id) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = type;
    button.textContent = type[0].toUpperCase() + type.slice(1);
    button.addEventListener("click", () => action(type, id, button));
    return button;
  }

  function renderService(service) {
    const card = document.createElement("div");
    card.className = "card";

    const heading = document.createElement("div");
    const name = document.createElement("b");
    name.textContent = service.name || "Unnamed container";
    heading.appendChild(name);

    const status = document.createElement("span");
    status.className = `status ${statusClass(service.status)}`;
    status.textContent = service.status || "unknown";
    heading.appendChild(status);
    card.appendChild(heading);

    const metadata = document.createElement("div");
    metadata.className = "meta";
    addTextRow(metadata, "Container", service.id);
    addTextRow(metadata, "Image", service.image);

    const ports = document.createElement("div");
    ports.className = "ports";
    const portsLabel = document.createElement("b");
    portsLabel.textContent = "Ports:";
    ports.appendChild(portsLabel);
    ports.appendChild(document.createElement("br"));
    renderPorts(ports, service.ports);
    metadata.appendChild(ports);

    addTextRow(metadata, "Started", service.started_at);
    addTextRow(metadata, "Uptime", service.uptime);
    card.appendChild(metadata);

    ["restart", "stop", "start"].forEach(type => {
      card.appendChild(createActionButton(type, service.id));
    });
    return card;
  }

  let loadInProgress = false;

  async function load() {
    if (loadInProgress) return;
    loadInProgress = true;

    try {
      const services = await requestJson("/api/services");
      const cards = services.map(renderService);
      document.getElementById("grid").replaceChildren(...cards);
      clearError();
    } catch (error) {
      showError(error.message);
    } finally {
      loadInProgress = false;
    }
  }

  async function poll() {
    await load();
    window.setTimeout(poll, 5000);
  }

  poll();
</script>

</body>
</html>
